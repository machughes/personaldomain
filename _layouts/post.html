---
layout: default
---
<article class="post">
  <header>
    <h1>{{ page.title }}</h1>
    <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time></p>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
  <p class="back"><a href="{{ '/blog/' | relative_url }}">&larr; All posts</a></p>
</article>
